<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Nova senha — Family Wallet</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:'Inter',sans-serif;background:linear-gradient(180deg,#0A0E27,#1A1F3A);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
    .card{width:100%;max-width:400px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:32px}
    h1{margin:0 0 8px;font-size:1.5rem;color:#E85D75}
    p{color:rgba(255,255,255,0.7);line-height:1.6;margin:0 0 20px}
    label{display:block;font-size:.85rem;margin:0 0 6px;color:rgba(255,255,255,0.8)}
    input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.25);color:#fff;font-size:1rem;margin-bottom:16px}
    button{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#E85D75,#A855F7);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
    button:disabled{opacity:.6;cursor:default}
    .msg{margin-top:16px;font-size:.9rem}
    .ok{color:#4ADE80}.err{color:#F87171}
  </style>
</head>
<body>
  <main class="card">
    <h1>Criar nova senha</h1>
    <p>Escolha uma senha com pelo menos 10 caracteres.</p>
    <form id="f">
      <label for="p1">Nova senha</label>
      <input id="p1" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
      <label for="p2">Repita a senha</label>
      <input id="p2" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
      <button type="submit" id="b">Salvar nova senha</button>
    </form>
    <div id="m" class="msg" role="status"></div>
  </main>
  <script>
    const API_URL = 'https://astonishing-expression-production-7fed.up.railway.app';
    const token = new URLSearchParams(location.search).get('token') || '';
    // Tira o token da barra de endereço/histórico assim que lido
    try { history.replaceState(null, '', location.pathname); } catch {}

    const f = document.getElementById('f'), m = document.getElementById('m'), b = document.getElementById('b');
    const show = (text, ok) => { m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); };
    const ERR = {
      invalid_token: 'Link inválido. Peça um novo no app.',
      token_used: 'Este link já foi usado. Peça um novo no app.',
      token_expired: 'Link expirado (vale 1 hora). Peça um novo no app.',
      invalid_request: 'Senha inválida: use de 10 a 72 caracteres.',
      too_many_requests: 'Muitas tentativas. Aguarde e tente de novo.',
    };

    if (!/^[a-f0-9]{64}$/.test(token)) { f.hidden = true; show(ERR.invalid_token, false); }

    f.addEventListener('submit', async e => {
      e.preventDefault();
      const p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
      if (p1 !== p2) return show('As senhas não conferem.', false);
      if (p1.length < 10) return show(ERR.invalid_request, false);
      b.disabled = true;
      try {
        const res = await fetch(`${API_URL}/api/auth/password/reset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: p1 }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok) { f.hidden = true; show('Senha alterada! Volte ao app e entre com a nova senha.', true); }
        else { show(ERR[data.error] || 'Não foi possível alterar a senha. Tente de novo.', false); b.disabled = false; }
      } catch {
        show('Sem conexão com o servidor. Tente de novo.', false); b.disabled = false;
      }
    });
  </script>
</body>
</html>
