<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="terms.title">Termos de Uso — Family Wallet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Inter',sans-serif;background:linear-gradient(180deg,#0A0E27,#1A1F3A);color:#fff;min-height:100vh;}
    .prose h2{color:#A855F7;font-weight:700;font-size:1.5rem;margin-top:2.5rem;margin-bottom:1rem;}
    .prose h3{font-weight:600;font-size:1.1rem;margin-top:1.5rem;margin-bottom:0.75rem;color:#fff;}
    .prose p,.prose li{color:rgba(255,255,255,0.8);line-height:1.75;margin-bottom:1rem;}
    .prose ul{list-style-type:disc;padding-left:1.5rem;}
    .prose strong{color:#fff;}
    .prose a{color:#A855F7;text-decoration:underline;}
  </style>
</head>
<body>
  <nav class="container mx-auto px-6 py-6 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3">
      <div class="w-10 h-10 bg-gradient-to-br from-rose-500 to-purple-700 rounded-xl flex items-center justify-center text-xl">💜</div>
      <span class="font-bold text-lg">Family Wallet</span>
    </a>
    <div class="flex items-center gap-3">
      <div class="relative">
        <button id="lang-toggle" class="flex items-center gap-1 px-3 py-2 rounded-lg border border-white/10 bg-white/5 hover:bg-white/10 text-sm">
          <span id="lang-current">🇧🇷 PT</span>
          <span class="text-white/50">▾</span>
        </button>
        <div id="lang-menu" class="hidden absolute right-0 top-full mt-2 bg-[#1A1F3A] border border-white/10 rounded-xl overflow-hidden min-w-[150px] z-50 shadow-xl">
          <button class="lang-option flex items-center gap-3 w-full px-4 py-3 hover:bg-white/5 text-sm" data-lang="pt"><span>🇧🇷</span><span>Português</span></button>
          <button class="lang-option flex items-center gap-3 w-full px-4 py-3 hover:bg-white/5 text-sm" data-lang="en"><span>🇺🇸</span><span>English</span></button>
          <button class="lang-option flex items-center gap-3 w-full px-4 py-3 hover:bg-white/5 text-sm" data-lang="es"><span>🇪🇸</span><span>Español</span></button>
          <button class="lang-option flex items-center gap-3 w-full px-4 py-3 hover:bg-white/5 text-sm" data-lang="zh"><span>🇨🇳</span><span>中文</span></button>
        </div>
      </div>
      <a href="/" class="text-sm text-white/70 hover:text-white" data-i18n="nav.back">← Voltar</a>
    </div>
  </nav>

  <main class="container mx-auto px-6 py-12 max-w-3xl">
    <div class="mb-12">
      <h1 class="text-4xl md:text-5xl font-black mb-4" data-i18n="terms.h1">Termos de Uso</h1>
      <p class="text-white/60" data-i18n="terms.updated">Última atualização: 30 de abril de 2026 · Versão 1.0</p>
    </div>

    <div class="prose max-w-none" id="terms-content">
      <!-- Renderizado pelo i18n-pages.js -->
    </div>
  </main>

  <footer class="container mx-auto px-6 py-10 border-t border-white/10 mt-12">
    <div class="text-center text-sm text-white/60" data-i18n="footer.made">© 2026 Family Wallet. Feito no Brasil 🇧🇷</div>
  </footer>

  <script src="/i18n.js"></script>
  <script src="/i18n-pages.js"></script>
  <script>
    const langToggle = document.getElementById('lang-toggle');
    const langMenu = document.getElementById('lang-menu');
    langToggle?.addEventListener('click', e => { e.stopPropagation(); langMenu.classList.toggle('hidden'); });
    document.addEventListener('click', () => langMenu?.classList.add('hidden'));
    document.querySelectorAll('.lang-option').forEach(opt => {
      opt.addEventListener('click', () => {
        window.I18N.setLang(opt.dataset.lang);
        window.renderTermsPage?.(opt.dataset.lang);
        langMenu.classList.add('hidden');
      });
    });
    document.addEventListener('DOMContentLoaded', () => {
      window.renderTermsPage?.(window.I18N.getLang());
    });
  </script>
</body>
</html>
